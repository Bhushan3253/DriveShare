spring.application.name=carpvt

# Database (MongoDB Atlas / Local MongoDB)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/car_rental}
spring.data.mongodb.database=${MONGODB_DATABASE:car_rental}
spring.data.mongodb.auto-index-creation=true

# Actuator Endpoints & Health Check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

server.port=${PORT:8081}
server.address=0.0.0.0

# Payment UPI Receiver Settings
payment.upi.id=${PAYMENT_UPI_ID:your-business-vpa@upi}
payment.upi.name=${PAYMENT_UPI_NAME:Car Rental Services}

# Cloudinary Storage Settings
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Multipart File Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Authentication Secret (Minimum 256-bit / 32 characters)
jwt.secret=${JWT_SECRET:carRentalSecretKeyForJwtAuthentication2026_Secure256BitKeyRequired}

# Application & Frontend URLs
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.mail.from=${MAIL_FROM:no-reply@driveshare.com}
app.init-demo-users=${APP_INIT_DEMO_USERS:false}

# Brevo (Sendinblue) HTTP REST API Configuration
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:no-reply@driveshare.com}
brevo.sender.name=${BREVO_SENDER_NAME:DriveShare Car Rental}

# Resend HTTP REST API Configuration
resend.api.key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:DriveShare <onboarding@resend.dev>}

# Spring Mail / SMTP Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000